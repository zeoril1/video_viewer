# video_viewer — микросервисная архитектура.
#
# Публичная точка входа — gateway (http://localhost:8080): раздаёт статику
# фронтенда и проксирует /api/* на внутренние сервисы:
#   catalog :8081 — каталог (IMDb/TMDB/Jackett, владеет PostgreSQL)
#   stream  :8082 — торрент-клиент, стриминг, HLS/ffmpeg
#   auth    :8083 — авторизация и история просмотра
# Внутренние сервисы НЕ публикуют порты наружу (доступны только в сети
# compose); наружу выставляются только gateway:8080 и торрент-порт 42069/udp.
#
# Доступ из локальной сети — сразу по http://<IP-хоста>:8080 (порт
# опубликован на всех интерфейсах). Доступ из интернета — необязательный
# профиль public (сервис caddy ниже): HTTPS-прокси на 80/443, поднимается
# командой `docker compose --profile public up -d`.
#
# Логирование:
#   docker compose up -d --build --progress plain   # подробный вывод сборки (все команды)
#   docker compose logs -f                          # живые логи всех сервисов
#   docker compose logs -f --tail=50 <service>      # логи одного сервиса (catalog/stream/auth/gateway/jackett/db)
#   docker compose ps                               # статус и здоровье контейнеров
# Логи каждого контейнера ограничены по размеру (см. logging у сервисов),
# чтобы подробный лог не заполнял диск.

services:
  db:
    image: postgres:16-alpine
    container_name: video-viewer-db
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-video_viewer}
      POSTGRES_USER: ${POSTGRES_USER:-video_viewer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-video_viewer}
    ports:
      - "5432:5432"        # PostgreSQL — доступ для pgAdmin 4 / внешних клиентов
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video_viewer -d video_viewer"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Сервис каталога (владеет таблицами films/sources в PostgreSQL) ---
  catalog:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: catalog
    image: video-viewer-catalog:latest
    container_name: video-viewer-catalog
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
      jackett:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://video_viewer:video_viewer@db:5432/video_viewer?sslmode=disable}
      # Ключи TMDB (api.themoviedb.org). Задайте в .env рядом с
      # docker-compose.yml (TMDB_API_KEY / TMDB_ACCESS_TOKEN) или в окружении.
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN:-}
      # Dev-пользователь (SeedDevUser) — создаётся только если заданы оба.
      DEV_USER: ${DEV_USER:-}
      DEV_PASSWORD: ${DEV_PASSWORD:-}
      # Прокси для IMDb — только статические (читаются из env).
      PROXY_STATIC: ${PROXY_STATIC:-}
      PROXY_TIMEOUT: ${PROXY_TIMEOUT:-10s}
      PROXY_MAX_ATTEMPTS: ${PROXY_MAX_ATTEMPTS:-3}
      # Jackett (Torznab) для поиска на трекерах с антиботом (RuTracker).
      JACKETT_URL: ${JACKETT_URL:-http://jackett:9117}
      JACKETT_API_KEY: ${JACKETT_API_KEY:-}
      JACKETT_INDEXER: ${JACKETT_INDEXER:-rutracker-ru}
    volumes:
      - ./data:/app/data   # каталог (catalog.json) — правите без пересборки образа
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  # --- Сервис стриминга (торрент-клиент + HLS/ffmpeg) ---
  stream:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: stream
        WITH_FFMPEG: "1"
    image: video-viewer-stream:latest
    container_name: video-viewer-stream
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      catalog:
        condition: service_healthy
    environment:
      # Для резолва магнет-ссылки по id (/api/stream/{id} без ?magnet=).
      CATALOG_URL: ${CATALOG_URL:-http://catalog:8081}
      # Дисковый спул скачанных кусков (вместо RAM): временный каталог, файлы
      # создаются по одному на серию/файл торрента (место выделяется только
      # под то, что качается) и удаляются после просмотра. Пустая
      # STREAM_DATA_DIR отключает спул.
      STREAM_DATA_DIR: ${STREAM_DATA_DIR:-/app/cache}
      # Ключи TMDB — для раскладки файлов сериалов по сезонам TMDB (у трекеров
      # своя нарезка сезонов, сборники нумеруют серии сквозняком).
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN:-}
    volumes:
      - stream-cache:/app/cache   # временные данные стриминга (спул)
    command: ["/app/app", "-addr", ":8082", "-port", "42069"]
    ports:
      - "42069:42069/udp"  # BitTorrent uTP/DHT (для входящих пиров)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  # --- Сервис авторизации и истории просмотра ---
  auth:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: auth
    image: video-viewer-auth:latest
    container_name: video-viewer-auth
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://video_viewer:video_viewer@db:5432/video_viewer?sslmode=disable}
      # Dev-пользователь (SeedDevUser) — создаётся только если заданы оба.
      DEV_USER: ${DEV_USER:-}
      DEV_PASSWORD: ${DEV_PASSWORD:-}
      # COOKIE_SECURE=1 — ставить Secure-флаг на куку сессии (если фронт
      # отдаётся за HTTPS-обратным прокси).
      COOKIE_SECURE: ${COOKIE_SECURE:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  # --- Сервис IPTV (плейлисты M3U/Xtream, каналы, EPG, live-HLS) ---
  # Плейлисты добавляются в админке (кнопка «IPTV»), креды провайдера
  # остаются на сервере: клиент получает только id канала и HLS с нас.
  iptv:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: iptv
        # ffmpeg нужен для перепаковки MPEG-TS каналов в HLS (HLS-каналы
        # проксируются без него).
        WITH_FFMPEG: "1"
    image: video-viewer-iptv:latest
    container_name: video-viewer-iptv
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://video_viewer:video_viewer@db:5432/video_viewer?sslmode=disable}
      # Каталог временных HLS-сессий ffmpeg (том ниже).
      IPTV_DATA_DIR: ${IPTV_DATA_DIR:-/app/cache}
    volumes:
      - iptv-cache:/app/cache
    command: ["/app/app", "-addr", ":8084", "-max-sessions", "${IPTV_MAX_SESSIONS:-8}", "-session-idle", "${IPTV_SESSION_IDLE:-90s}", "-sync-interval", "${IPTV_SYNC_INTERVAL:-6h}", "-epg-interval", "${IPTV_EPG_INTERVAL:-3h}"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8084/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  # --- API-шлюз (публичная точка входа: web + прокси /api/*) ---
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: gateway
    image: video-viewer-gateway:latest
    container_name: video-viewer
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      catalog:
        condition: service_healthy
      stream:
        condition: service_healthy
      auth:
        condition: service_healthy
      iptv:
        condition: service_healthy
    environment:
      TRUSTED_PROXY: ${TRUSTED_PROXY:-caddy}
      CATALOG_URL: ${CATALOG_URL:-http://catalog:8081}
      STREAM_URL: ${STREAM_URL:-http://stream:8082}
      AUTH_URL: ${AUTH_URL:-http://auth:8083}
      IPTV_URL: ${IPTV_URL:-http://iptv:8084}
    ports:
      - "8080:8080"        # веб-интерфейс / API (единственный публичный HTTP-порт)
    volumes:
      - ./web:/app/web     # фронтенд — правите без пересборки образа
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  # --- Публичный доступ из интернета (НЕОБЯЗАТЕЛЬНЫЙ профиль public) ---
  # Caddy терминирует HTTPS (сертификат Let's Encrypt получает сам) и
  # проксирует всё на gateway. Нужен, когда вы пробрасываете порты
  # 80/443 на роутере: наружу отдаётся только он, шлюз остаётся для
  # локальной сети по 8080.
  #   docker compose --profile public up -d
  #   .env → PUBLIC_DOMAIN=vv-home.duckdns.org (домен, указывающий на ваш IP)
  # Проброс на роутере: 80→80 и 443→443 этого хоста.
  caddy:
    image: caddy:2-alpine
    container_name: video-viewer-caddy
    restart: unless-stopped
    profiles: ["public"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      # Домен для сертификата; пусто → localhost (самоподписанный, для проверки).
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
    ports:
      - "80:80"            # HTTP: ACME-проверка Let's Encrypt + редирект на HTTPS
      - "443:443"          # HTTPS: публичный вход в веб-интерфейс из интернета
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro  # конфиг — правится без пересборки
      - caddy-data:/data                     # сертификаты (не терять при пересоздании)
      - caddy-config:/config
    healthcheck:
      # Проверяем по admin-API Caddy (localhost:2019): он есть всегда, а
      # «сайт» зависит от PUBLIC_DOMAIN (http-порт отвечает редиректом).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # --- Jackett — поиск раздач на трекерах с антиботом/приватных (RuTracker):
  # сам хранит доступы, решает капчу при настройке и обходит Cloudflare. ---
  jackett:
    image: linuxserver/jackett
    container_name: video-viewer-jackett
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Moscow}
      AUTO_UPDATE: "true"
    ports:
      - "${JACKETT_PORT:-9117}:9117"  # веб-интерфейс Jackett (добавить индексер RuTracker)
    volumes:
      # Конфиг Jackett (индексера, API-ключ) хранится в ./jackett — не теряется
      # при пересоздании контейнера. API-ключ: ./jackett/Jackett/ServerConfig.json.
      - ./jackett:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9117/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

volumes:
  pgdata:
  # Временные данные стриминга (дисковый спул stream-сервиса);
  # контейнер удаляет файлы спула после просмотра сам.
  stream-cache:
  # Временные HLS-сессии ffmpeg сервиса IPTV (плейлист и сегменты канала);
  # сессия гасится после бездействия, каталог удаляется.
  iptv-cache:
  # Caddy (профиль public): сертификаты Let's Encrypt и его конфиг —
  # не пересоздавать при обновлении контейнера, иначе легко упереться
  # в лимиты Let's Encrypt на выпуск сертификатов.
  caddy-data:
  caddy-config:
