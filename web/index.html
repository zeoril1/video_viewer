<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Кинотека</title>
  <script src="theme.js?v=1"></script>
  <link rel="stylesheet" href="style.css?v=22" />
  <link rel="stylesheet" href="tv.css?v=2" />
  <link rel="stylesheet" href="features.css?v=2" />
  <link rel="stylesheet" href="redesign.css?v=1" />
</head>
<body data-page="catalog">
  <header class="topbar">
    <a class="logo" href="/">Кинотека</a>
    <input id="search" class="search" type="search" aria-label="Поиск по каталогу" placeholder="Найти фильм или сериал" autocomplete="off" />
    <div class="lang-switch" role="group" aria-label="Язык / Language">
      <button id="lang-ru" class="lang-btn" data-lang="ru" type="button">RU</button>
      <button id="lang-en" class="lang-btn" data-lang="en" type="button">EN</button>
    </div>
    <div class="user-area" id="user-area" hidden>
      <span id="user-name" class="user-name"></span>
      <a id="admin-link" class="auth-btn" href="/admin.html" hidden>Администрирование</a>
      <button id="auth-logout" class="auth-btn" type="button">Выйти</button>
    </div>
    <a id="auth-open" class="auth-btn auth-btn-primary" href="/login.html" hidden>Войти</a>
  </header>

  <main>
    <section id="continue" class="continue" aria-labelledby="continue-title" hidden>
      <h2 id="continue-title" class="continue-title"></h2>
      <div id="continue-list" class="continue-list"></div>
    </section>
    <div class="catalog-topline">
      <h1 class="catalog-heading" data-i18n="catalog">Каталог</h1>
      <button id="filter-toggle" class="auth-btn filter-toggle" type="button" aria-expanded="false" aria-controls="filter-controls" data-i18n="filters">Фильтры</button>
    </div>
    <div id="catalog-filters" class="filters">
      <nav id="sections" class="sections" aria-label="Разделы"></nav>
      <div id="filter-controls" class="filter-controls">
        <label class="released-toggle"><input id="hide-watched" type="checkbox"> Скрыть просмотренное</label>
        <label class="released-toggle" title="Показывать только вышедшие фильмы">
          <input type="checkbox" id="released" checked />
          <span data-i18n="onlyReleased">Только вышедшие</span>
        </label>
        <select id="genre" class="genre-select" aria-label="Жанр">
          <option value="">Все жанры</option>
        </select>
        <select id="sort" class="genre-select" aria-label="Сортировка"></select>
        <button id="catalog-reset" class="auth-btn catalog-reset" type="button" data-i18n="resetFilters">Сбросить фильтры</button>
      </div>
    </div>
    <div id="grid" class="grid" aria-label="Каталог фильмов и сериалов" aria-busy="false"></div>
    <p id="empty" class="empty" role="status" aria-live="polite" hidden>Ничего не найдено.</p>
    <div id="sentinel" class="sentinel" hidden></div>
  </main>

  <script src="shared.js?v=3"></script>
  <script src="personal.js?v=2"></script>
  <script src="features.js?v=1"></script>
  <script src="catalog.js?v=2"></script>
  <script src="tv.js?v=3"></script>
</body>
</html>
