<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Календарь новинок — Кинотека</title>
    <script src="theme.js?v=1"></script>
    <link rel="stylesheet" href="style.css?v=22" />

      <h1>Календарь новинок</h1>
      <div id="feature-toolbar" class="feature-toolbar"></div>
      <p
        id="feature-status"
        class="feature-message"
        role="status"
        aria-live="polite"
        hidden
      ></p>
      <div id="feature-content"></div>
    </main>
    <script src="shared.js?v=3"></script>
    <script src="personal.js?v=2"></script>
